<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hoverslam numbers</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; height: auto; min-height: 100vh; background: #000; }
  .dv { max-width: 1120px; margin: 0 auto; padding: 36px clamp(16px, 4vw, 40px) 80px; }
  .dv h1 { font: 700 44px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; margin: 0; }
  .dv header { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--seam); padding-bottom: 16px; margin-bottom: 26px; }
  .dv header small { color: var(--dim); font-size: 13px; }
  .dv h2 { margin: 36px 0 14px; font: 600 12px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
  .dtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 1px solid var(--seam); border-left: 1px solid var(--seam); }
  .dtile { padding: 16px 18px 18px; border-right: 1px solid var(--seam); border-bottom: 1px solid var(--seam); }
  .dtile i { display: block; font: 600 11px/1.2 var(--body); font-style: normal; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .dtile b { font: 700 42px/1 var(--display); letter-spacing: 0.02em; }
  .dtile small { display: block; margin-top: 6px; color: var(--muted); font-size: 12.5px; }
  .dtwo { display: grid; grid-template-columns: 1.4fr 1fr; gap: 36px; }
  @media (max-width: 820px) { .dtwo { grid-template-columns: 1fr; gap: 0; } }
  table.dt { width: 100%; border-collapse: collapse; font-size: 14px; }
  .dt th { text-align: left; font: 600 11px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); padding: 0 12px 10px 0; border-bottom: 1px solid var(--seam); }
  .dt td { padding: 11px 12px 11px 0; border-bottom: 1px solid #1d1d1d; font-variant-numeric: tabular-nums; }
  .dt td:first-child { font: 700 18px var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
  .hbars { display: grid; gap: 9px; }
  .hbar { display: grid; grid-template-columns: 150px 1fr 48px; gap: 12px; align-items: center; font-size: 14px; }
  .hbar > span:first-child { color: #d6d6d6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar > div { height: 10px; background: #161616; }
  .hbar > div > i { display: block; height: 100%; background: var(--blue); }
  .hbar > b { text-align: right; font-variant-numeric: tabular-nums; }
  .dchart { display: flex; align-items: end; gap: 6px; height: 150px; padding-top: 10px; }
  .dchart > div { flex: 1; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 6px; height: 100%; min-width: 0; }
  .dchart .dcol { width: 100%; display: flex; align-items: end; gap: 2px; flex: 1; }
  .dchart .dcol i { flex: 1; display: block; min-height: 2px; }
  .dchart .p { background: var(--blue); } .dchart .g { background: #fff; opacity: 0.85; }
  .dchart small { font-size: 10.5px; color: var(--muted); }
  .dkey { display: flex; gap: 16px; font-size: 12.5px; color: var(--dim); margin-top: 10px; }
  .dkey i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
  .dfb { display: grid; gap: 0; }
  .dfb li { list-style: none; padding: 14px 0; border-bottom: 1px solid #1d1d1d; display: grid; gap: 6px; }
  .dfb .meta { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; display: flex; gap: 12px; flex-wrap: wrap; }
  .dfb .stars { color: #fff; letter-spacing: 2px; } .dfb .stars u { text-decoration: none; color: #444; }
  .dfb p { margin: 0; color: #e8e8e8; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dgate { max-width: 420px; margin: 20vh auto; padding: 0 20px; display: grid; gap: 14px; }
  .dgate input { padding: 12px 14px; background: var(--plate); border: 1px solid var(--seam); border-radius: 4px; color: #fff; font: 400 16px var(--body); }
  .derr { color: var(--alarm); font-size: 14px; min-height: 20px; }
  .dempty { color: var(--muted); }
</style>
</head>
<body>
<div class="dv" id="app"></div>
<script>
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '-');
const dur = (s) => (s ? (s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's') : '-');

function tile(label, value, note) { return `<div class="dtile"><i>${label}</i><b>${value}</b>${note ? `<small>${note}</small>` : ''}</div>`; }
function hbars(rows, none) { return rows.length ? bars(rows) : `<p class="dempty">${none || 'Nothing yet.'}</p>`; }
function bars(rows, total) { const max = Math.max(1, ...rows.map((r) => r.n)); return rows.length ? `<div class="hbars">${rows.map((r) => `<div class="hbar"><span title="${esc(r.label)}">${esc(r.label)}</span><div><i style="width:${(r.n / max) * 100}%"></i></div><b>${r.n}</b></div>`).join('')}</div>` : '<p class="dempty">Nothing yet.</p>'; }

function render(d) {
  const t = d.totals, f = d.feedback;
  const maxDay = Math.max(1, ...d.daily.map((x) => Math.max(x.players, x.games)));
  const devTotal = d.devices.reduce((a, b) => a + b.n, 0);
  const sim = (d.modes.find((m) => m.mode === 'sim') || {}).n || 0;
  $app.innerHTML = `
  <header><h1>Hoverslam numbers</h1><small>Updated ${new Date(d.generated).toLocaleTimeString()} · refreshes every 30 s</small></header>
  <div class="dtiles">
    ${tile('Players', t.players, 'ever, by browser')}
    ${tile('Last 24 h', t.day, 'players')}
    ${tile('Last 7 days', t.week, 'players')}
    ${tile('Last 30 days', t.month, 'players')}
    ${tile('Came back', t.returning, t.players ? pct(t.returning, t.players) + ' of players, on a later day' : '')}
    ${tile('Visits', t.visits, 'sessions')}
    ${tile('Descents started', t.starts, sim ? sim + ' in the autopilot lab' : '')}
    ${tile('Descents finished', t.ends, pct(t.ends, t.starts) + ' of started')}
    ${tile('Landings', t.landed, pct(t.landed, t.ends) + ' of finished')}
    ${tile('Games per player', t.players ? (t.starts / t.players).toFixed(1) : '-', '')}
    ${tile('Average descent', dur(t.avgSeconds), '')}
    ${tile('Rating', f.avg ? f.avg.toFixed(1) + ' / 5' : '-', f.count + ' responses')}
  </div>

  <h2>Last 14 days</h2>
  <div class="dchart" role="img" aria-label="Players and games per day">${d.daily.map((x) => `<div title="${x.day}: ${x.players} players, ${x.games} games"><div class="dcol"><i class="p" style="height:${(x.players / maxDay) * 100}%"></i><i class="g" style="height:${(x.games / maxDay) * 100}%"></i></div><small>${x.day.slice(8)}</small></div>`).join('')}</div>
  <div class="dkey"><span><i style="background:var(--blue)"></i>Players</span><span><i style="background:#fff"></i>Games started</span></div>

  <div class="dtwo">
    <div>
      <h2>By level</h2>
      ${d.levels.length ? `<table class="dt"><tr><th>Level</th><th>Started</th><th>Landed</th><th>Rate</th><th>Avg score</th><th>Avg time</th></tr>${d.levels.map((l) => `<tr><td>${l.level}</td><td>${l.starts}</td><td>${l.landed}</td><td>${pct(l.landed, l.ends)}</td><td>${l.avgScore ?? '-'}</td><td>${dur(l.avgSeconds)}</td></tr>`).join('')}</table>` : '<p class="dempty">No games yet.</p>'}
    </div>
    <div>
      <h2>How runs end</h2>
      ${bars(d.outcomes.map((o) => ({ label: o.outcome, n: o.n })))}
      <h2>Devices</h2>
      ${bars(d.devices.map((o) => ({ label: o.device + (devTotal ? ' · ' + pct(o.n, devTotal) : ''), n: o.n })))}
    </div>
  </div>

  <div class="dtwo">
    <div>
      <h2>What they do</h2>
      ${hbars(d.features.map((o) => ({ label: o.label.replace(/_/g, ' '), n: o.n })))}
    </div>
    <div>
      <h2>Where from</h2>
      ${hbars(d.countries.map((o) => ({ label: o.country, n: o.n })))}
      <h2>Came from</h2>
      ${hbars(d.refs.map((o) => ({ label: o.ref, n: o.n })), 'Direct visits only so far.')}
    </div>
  </div>

  <h2>Feedback · ${f.count} ${f.count === 1 ? 'response' : 'responses'}</h2>
  ${f.count ? bars(f.stars.map((n, i) => ({ label: (i + 1) + (i ? ' stars' : ' star'), n })).reverse()) : ''}
  <ul class="dfb" style="padding:0;margin-top:18px">${f.latest.length ? f.latest.map((r) => `<li><div class="meta"><span class="stars">${r.rating ? '★'.repeat(r.rating) + '<u>' + '★'.repeat(5 - r.rating) + '</u>' : 'no rating'}</span><span>${esc(r.level || '')}</span><span>${esc(r.outcome || '')}${r.score != null ? ' · score ' + r.score : ''}</span><span>${new Date(r.created_at).toLocaleString()}</span></div>${r.comment ? `<p>${esc(r.comment)}</p>` : ''}</li>`).join('') : '<li class="dempty">No feedback yet.</li>'}</ul>`;
}

let timer = 0;
const msg = (t) => { $app.innerHTML = `<div class="dgate"><h1>Hoverslam numbers</h1><div class="derr">${esc(t)}</div></div>`; };
async function load() {
  if (!$app.querySelector('.dtiles')) $app.innerHTML = '<div class="dgate"><h1>Hoverslam numbers</h1><div class="dempty">Loading...</div></div>';
  try {
    const res = await fetch('/api/stats', { cache: 'no-store', credentials: 'same-origin' });
    if (res.status === 401) return msg('Login expired. Reload this page.');
    if (!res.ok) { const j = await res.json().catch(() => ({})); return msg(j.error || 'Could not load'); }
    render(await res.json());
    clearInterval(timer); timer = setInterval(load, 30000);
  } catch { msg('No connection.'); }
}
load();
</script>
</body>
</html>
